<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SoundCloud 強調の設定</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>表示設定</h1>
  <label class="toggle" for="default-filter">
    <span>最初から候補だけ表示</span>
    <input id="default-filter" type="checkbox" role="switch" disabled>
    <span class="switch" aria-hidden="true"></span>
  </label>
  <label class="toggle" for="auto-load">
    <span>50曲まで自動読み込み</span>
    <input id="auto-load" type="checkbox" role="switch" disabled>
    <span class="switch" aria-hidden="true"></span>
  </label>
  <p class="note">設定は自動で保存され、開いている一覧にも反映されます。右上の件数クリックで、そのページの絞り込みを切り替えられます。</p>
  <p id="settings-status" role="status" aria-live="polite"></p>
  <h2>ダウンロードのタグ付け</h2>
  <button id="external-setup" type="button">自動タグ付けの設定</button>
  <p id="external-status" class="note" role="status"></p>
  <h2>判定データの移行</h2>
  <p>書き出したファイルを別のPCで読み込むと、確認済みの曲を引き継げます。</p>
  <button id="export" type="button">判定データを書き出す</button>
  <label for="import">判定データを読み込む</label>
  <input id="import" type="file" accept=".json,application/json">
  <p class="note">有効期限（確認から24時間）はそのまま引き継ぎます。読み込み後はSoundCloudを再読み込みしてください。</p>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
